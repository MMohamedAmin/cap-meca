# Mise en ligne sur GitHub Pages à chaque envoi sur la branche main.
# Le site n'est publié que si la vérification du contenu passe
# (questions, images, lexique, sw.js à jour) et si les tests du site et de l'assistant IA passent.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Vérifier le contenu
        run: node outils/verifier-donnees.js

      - name: Tester le site
        run: node outils/tests-site.js

      - name: Tester l'assistant IA (sans clé API)
        run: |
          npm ci --no-fund --no-audit
          npm run test-ia

      - name: Assembler le site
        run: node outils/preparer-site.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v5
